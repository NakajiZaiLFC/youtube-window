<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi-Fi Player</title>
<style>
  :root {
    --bg:#f4eff2; --card:#fbf8fa; --text:#1d1d1f; --text-2:#6b6b70; --text-3:#a6a0a6;
    --fill:#e9e3e8; --fill-2:#ded7dd;
    --accent:#f4a259; --accent-d:#d98a3d; --accent-ink:#4a2e16; --radius:16px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    width:460px; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; letter-spacing:-0.01em; overflow:hidden;
  }
  body { padding:14px 16px 12px; }
  /* PiP モード: リサイズされても中身は固定幅で中央寄せ（拡大時は余白、縮小時はクリップ） */
  body.pip { width:100%; padding:10px 12px; display:flex; justify-content:center; align-items:flex-start; }
  body.pip .wrap { width:436px; flex:none; }

  .wrap { position:relative; }

  /* 右上アイコン群（最前面固定 / ループ）= 機能は内部で常時有効、表示は隠す */
  .corner { display:none; }
  .corner-shown { position:absolute; top:-2px; right:-2px; display:flex; gap:2px; z-index:2; }
  .icon { font-size:15px; line-height:1; background:none; border:none; cursor:pointer;
          color:var(--text-3); width:28px; height:28px; border-radius:50%; transition:.15s;
          display:grid; place-items:center; }
  .icon:hover { background:var(--fill); color:var(--text-2); }
  #loop.on { color:var(--accent); background:rgba(244,162,89,.16); }
  #float.on { color:var(--accent); background:rgba(244,162,89,.16); }

  /* 上段カード: サムネ | メタ | 再生ボタン */
  .card { display:grid; grid-template-columns:74px 1fr auto; align-items:center;
          gap:14px; background:var(--card); border-radius:var(--radius);
          padding:12px 14px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .thumb { width:74px; height:74px; border-radius:12px; object-fit:cover;
           background:var(--fill-2); display:block; }
  .thumb.empty { display:grid; place-items:center; font-size:26px; color:var(--text-3); }

  .meta { min-width:0; padding-right:6px; }
  .src { display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
         color:var(--text-3); margin-bottom:3px; }
  .src .yt { color:#ff0033; font-size:11px; }
  .marquee { overflow:hidden; white-space:nowrap; }
  #now { display:inline-block; white-space:nowrap; font-size:17px; font-weight:700;
         letter-spacing:-0.02em; line-height:1.3; will-change:transform; }
  #now.scroll { animation:walk var(--dur,8s) ease-in-out infinite alternate; }
  @keyframes walk { 0%,18%{transform:translateX(0)} 82%,100%{transform:translateX(var(--shift,0))} }
  #channel { font-size:12px; font-weight:500; color:var(--text-2); margin-top:2px;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* 大きい丸い再生ボタン */
  #playpause { width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
               background:var(--accent); color:var(--accent-ink); font-size:21px;
               display:grid; place-items:center; box-shadow:0 2px 8px rgba(244,162,89,.4);
               transition:transform .1s, filter .15s; }
  #playpause:hover { filter:brightness(1.05); }
  #playpause:active { transform:scale(.93); }

  /* 下段トランスポート */
  .bar { display:grid; grid-template-columns:auto auto 1fr auto auto; align-items:center;
         column-gap:8px; padding:14px 2px 2px; }
  .bbtn { position:relative; border:none; background:none; cursor:pointer; color:var(--text);
          width:46px; height:46px; display:grid; place-items:center; font-size:24px;
          border-radius:10px; transition:opacity .15s, transform .1s, background .15s; }
  .bbtn:hover { background:var(--fill); }
  .bbtn:active { transform:scale(.9); }
  .bbtn .n { position:absolute; bottom:7px; right:4px; font-size:10px; font-weight:700;
             color:var(--text-2); }

  #seek { grid-column:3; -webkit-appearance:none; appearance:none; width:100%; height:4px;
          border-radius:2px; background:var(--fill-2); cursor:pointer; }
  #seek::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
          background:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.3); }

  /* 状態 + 時間 */
  /* シーク列(3)の真下に揃える: 左端=現在 / 右端=この動画の総時間 */
  .times { grid-column:3; grid-row:2; display:flex; justify-content:space-between;
           margin-top:7px; transform:translateX(20px);
           font-size:11px; color:var(--text-3); font-variant-numeric:tabular-nums; }
  #status { display:flex; align-items:center; gap:6px; margin-top:6px; padding:0 6px;
            font-size:12px; font-weight:500; color:var(--text-2); }
  #status::before { content:""; width:7px; height:7px; border-radius:50%;
                    background:var(--accent); flex:none; }
  #status.idle::before { background:var(--text-3); }

  #ver { display:none; }
</style>
</head>
<body>
  <div id="wrap" class="wrap">
    <div class="corner">
      <button id="loop" class="icon" title="リピート" aria-label="リピート">🔁</button>
      <button id="float" class="icon" title="小窓で開く" aria-label="小窓で開く">⧉</button>
    </div>

    <div class="card">
      <img id="thumb" class="thumb" alt="" referrerpolicy="no-referrer">
      <div class="meta">
        <div class="src"><span class="yt">▶</span><span>youtube.com</span></div>
        <div class="marquee"><span id="now">—</span></div>
        <div id="channel"></div>
      </div>
      <button id="playpause" title="再生 / 一時停止" aria-label="再生 / 一時停止">▶</button>
    </div>

    <div class="bar">
      <button id="prev" class="bbtn" title="前の曲" aria-label="前の曲">⏮</button>
      <button id="back15" class="bbtn" title="15秒戻す" aria-label="15秒戻す">↺<span class="n">15</span></button>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="再生位置">
      <button id="fwd15" class="bbtn" title="15秒進む" aria-label="15秒進む">↻<span class="n">15</span></button>
      <button id="next" class="bbtn" title="次の曲" aria-label="次の曲">⏭</button>
      <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
    </div>
    <div id="status" class="idle">停止中</div>
    <button id="export" hidden></button>
    <span id="ver"></span>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
